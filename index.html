<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভোরের বাণী</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#b00;--ink:#1c1917;--mut:#6e6761;--soft:#f4f2f0;--ln:#e5e1dd}
*{box-sizing:border-box}
body{margin:0;font:17px/1.75 'Hind Siliguri',sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:'Noto Serif Bengali',serif;line-height:1.4;margin:0}
.w{max-width:1160px;margin:auto;padding:0 16px}
#dt{background:var(--r);color:#fff;font-size:14px;text-align:center;padding:3px 16px}
header{padding:14px 0}
header img{height:58px;margin:auto}
nav{position:sticky;top:0;z-index:5;background:#fff;border-top:1px solid var(--ln);border-bottom:3px solid var(--r);overflow-x:auto;white-space:nowrap;text-align:center}
nav a{display:inline-block;padding:8px 14px;font-weight:600}
nav a.on,nav a:hover{color:var(--r)}
.ad{display:flex;align-items:center;justify-content:center;margin:20px auto;background:var(--soft);color:var(--mut);font-size:14px;overflow:hidden;max-width:100%}
.ad img{max-width:100%;height:auto}
.ad-side{width:300px;max-width:100%}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:22px}
.lead{position:relative;display:block;min-height:380px;background:var(--soft);overflow:hidden}
.lead img,.lead .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lead div{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.lead h2{font-size:30px;font-weight:800}
.k{display:inline-block;color:var(--r);font-weight:600;font-size:14px;border-left:3px solid var(--r);padding-left:7px;line-height:1.2;margin:8px 0 2px}
.lead .k{color:#fff;border-color:#fff;margin-top:0}
.sd{display:grid;gap:16px;align-content:start}
.sd a{display:grid;grid-template-columns:96px 1fr;gap:12px}
.sd img,.sd .ph{width:96px;height:72px;object-fit:cover}
.sd h3{font-size:17px}
.ph{background:var(--soft)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:32px;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.c img,.c .ph{width:100%;aspect-ratio:16/10;object-fit:cover}
.c h3{font-size:18px}
time{display:block;color:var(--mut);font-size:14px}
h2.sec{font-size:22px;border-bottom:2px solid var(--ln);padding-bottom:6px;margin:22px 0 16px}
.ls a{display:block;padding:9px 0;border-bottom:1px solid var(--ln);font-weight:600;line-height:1.5}
.art{max-width:760px;margin:26px auto}
.art h1{font-size:34px;font-weight:800}
.art .m{color:var(--mut);font-size:15px;margin:10px 0 16px}
.art img.hi{width:100%;margin-bottom:18px}
.art p{margin:0 0 1.1em;font-size:18.5px;line-height:1.95}
.em{text-align:center;color:var(--mut);padding:60px 0}
footer{background:var(--ink);color:#d8d2cc;text-align:center;padding:22px 16px;margin-top:40px;font-size:15px}
a:focus-visible{outline:3px solid var(--r);outline-offset:2px}
@media(max-width:820px){.hero,.cols{grid-template-columns:1fr}.lead{min-height:280px}.lead h2{font-size:23px}.art h1{font-size:26px}.ad-side{margin:20px auto}}
</style>
</head>
<body>
<div id="dt"></div>
<header><a href="#/"><img src="logo.svg" alt="ভোরের বাণী"></a></header>
<nav id="nav"></nav>
<main class="w" id="app"><p class="em">লোড হচ্ছে…</p></main>
<footer>© ভোরের বাণী। সর্বস্বত্ব সংরক্ষিত।</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="core.js"></script>
<script>
const $ = s => document.querySelector(s);
let N = [], A = {};
const bd = ms => new Date(ms).toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
const im = (n, c = '') => n.img ? `<img class="${c}" src="${E(n.img)}" alt="" loading="lazy">` : `<div class="ph ${c}"></div>`;
const card = n => `<a class="c" href="#/n/${n.id}">${im(n)}<span class="k">${E(n.cat)}</span><h3>${E(n.title)}</h3><time>${bd(n.date)}</time></a>`;
const ad = k => {
  const a = A[k] || {}, s = SLOTS[k];
  if (a.off) return '';
  const h = a.html || (a.img ? `<a href="${E(a.link || '#')}" target="_blank" rel="noopener sponsored"><img src="${E(a.img)}" alt="বিজ্ঞাপন"></a>` : `বিজ্ঞাপনের জায়গা ${s.size}`);
  return `<div class="ad ad-${k}" style="min-height:${s.h}px">${h}</div>`;
};
function runScripts(el) {
  el.querySelectorAll('.ad script').forEach(o => {
    const s = document.createElement('script');
    [...o.attributes].forEach(a => s.setAttribute(a.name, a.value));
    s.text = o.text; o.replaceWith(s);
  });
}
function nav(cur) {
  $('#nav').innerHTML = `<a href="#/" class="${cur ? '' : 'on'}">প্রথম পাতা</a>` +
    CATS.map(c => `<a href="#/c/${encodeURIComponent(c)}" class="${cur === c ? 'on' : ''}">${c}</a>`).join('');
}
function home(L) {
  if (!L.length) return '<p class="em">এখনো কোনো খবর প্রকাশ হয়নি।</p>';
  const lead = L.find(n => n.featured) || L[0], rest = L.filter(n => n !== lead);
  return `${ad('top')}
  <div class="hero">
    <a class="lead" href="#/n/${lead.id}">${im(lead)}<div><span class="k">${E(lead.cat)}</span><h2>${E(lead.title)}</h2></div></a>
    <div class="sd">${rest.slice(0, 3).map(n => `<a href="#/n/${n.id}">${im(n)}<div><h3>${E(n.title)}</h3><time>${bd(n.date)}</time></div></a>`).join('')}</div>
  </div>
  ${ad('mid')}
  <div class="cols">
    <section><h2 class="sec">সর্বশেষ খবর</h2><div class="g">${rest.slice(3).map(card).join('') || '<p>আরও খবর শিগগিরই আসছে।</p>'}</div></section>
    <aside>${ad('side')}<h2 class="sec">আলোচিত</h2><div class="ls">${L.slice(0, 7).map(n => `<a href="#/n/${n.id}">${E(n.title)}</a>`).join('')}</div></aside>
  </div>`;
}
function article(n, L) {
  document.title = n.title + ' | ভোরের বাণী';
  const ps = String(n.body).split(/\n+/).map(p => `<p>${E(p)}</p>`);
  ps.splice(2, 0, ad('art'));
  const rel = L.filter(x => x.cat === n.cat && x.id !== n.id).slice(0, 3);
  return `<article class="art"><span class="k">${E(n.cat)}</span><h1>${E(n.title)}</h1>
    <div class="m">${n.author ? E(n.author) + '। ' : ''}${bd(n.date)}</div>
    ${n.img ? `<img class="hi" src="${E(n.img)}" alt="">` : ''}${ps.join('')}</article>
    ${rel.length ? `<h2 class="sec">আরও পড়ুন</h2><div class="g">${rel.map(card).join('')}</div>` : ''}
    <div class="cols" style="display:block">${ad('side')}</div>`;
}
function route() {
  const [t, v] = location.hash.slice(2).split('/'), id = decodeURIComponent(v || '');
  const L = [...N].sort((a, b) => b.date - a.date);
  let h, cur = '';
  document.title = 'ভোরের বাণী';
  if (t === 'n') { const n = N.find(x => x.id === id); h = n ? article(n, L) : '<p class="em">খবরটি পাওয়া যায়নি।</p>'; }
  else if (t === 'c') { cur = id; const f = L.filter(n => n.cat === id); h = ad('top') + `<h2 class="sec">${E(id)}</h2>` + (f.length ? `<div class="cols"><div class="g">${f.map(card).join('')}</div><aside>${ad('side')}</aside></div>` : '<p class="em">এই বিভাগে এখনো খবর নেই।</p>'); }
  else h = home(L);
  nav(cur);
  $('#app').innerHTML = h;
  runScripts($('#app'));
  scrollTo(0, 0);
}
$('#dt').textContent = new Date().toLocaleDateString('bn-BD', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
Promise.all([DB.all('news'), DB.all('ads')]).then(([n, a]) => {
  N = n; a.forEach(x => A[x.id] = x);
  route(); addEventListener('hashchange', route);
}).catch(() => $('#app').innerHTML = '<p class="em">খবর লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।</p>');
</script>
</body>
</html>
