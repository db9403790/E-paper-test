<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভোরের বাণী</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--r:#b00;--ink:#1c1917;--mut:#6e6761;--soft:#f4f2f0;--ln:#e0dbd6}
*{box-sizing:border-box}
body{margin:0;font:17px/1.7 'Hind Siliguri',sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
a:hover h2,a:hover h3,.ls a:hover{color:var(--r)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:'Noto Serif Bengali',serif;line-height:1.45;margin:0}
.w{max-width:1200px;margin:auto;padding:0 16px}
#dt{border-bottom:1px solid var(--ln);font-size:14px;color:var(--mut);padding:5px 0}
header{padding:16px 0 12px;text-align:center;border-bottom:1px solid var(--ln)}
header img{height:64px;margin:auto}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--r);box-shadow:0 2px 0 #fff;overflow-x:auto;white-space:nowrap}
nav .w{display:flex;justify-content:center}
nav a{padding:9px 14px;font-weight:600}
nav a.on,nav a:hover{color:var(--r);box-shadow:inset 0 -3px 0 var(--r)}
.tk{display:flex;align-items:center;border-bottom:1px solid var(--ln);font-weight:600;font-size:15.5px}
.tk b{background:var(--r);color:#fff;padding:2px 12px;margin-right:12px;flex:none}
.tw{overflow:hidden;flex:1}
.tw div{display:inline-block;white-space:nowrap;padding-left:100%;animation:m 50s linear infinite}
.tw div:hover{animation-play-state:paused}
.tw a+a::before{content:"●";color:var(--r);font-size:9px;margin:0 16px;vertical-align:middle}
@keyframes m{to{transform:translateX(-100%)}}
.ad{display:flex;align-items:center;justify-content:center;margin:18px auto;background:var(--soft);color:var(--mut);font-size:13px;overflow:hidden;max-width:100%}
.ad img{max-width:100%;height:auto}
.ad-side{width:300px}
.hero{display:grid;grid-template-columns:250px 1fr 300px;margin-top:20px}
.hero.nl{grid-template-columns:1fr 300px}
.col{padding:0 20px;border-left:1px solid var(--ln)}
.col:first-child{padding-left:0;border:0}
.col:last-child{padding-right:0}
.l{display:grid;gap:18px;align-content:start}
.k{display:inline-block;color:var(--r);font-weight:600;font-size:14px;line-height:1.2;margin:10px 0 2px}
.b img,.b .ph{width:100%;aspect-ratio:16/9;object-fit:cover}
.b h2{font-size:26px;font-weight:800}
.m .b h2{font-size:34px}
.b p{margin:6px 0;color:#3d3834}
.s img,.s .ph{width:100%;aspect-ratio:16/10;object-fit:cover}
.s h3{font-size:18px}
.ph{background:var(--soft)}
time{display:block;color:var(--mut);font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;padding-top:16px;border-top:1px solid var(--ln)}
h2.sec{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--r);border-bottom:1px solid var(--ln);padding:5px 0;margin:26px 0 16px;font-size:22px}
h2.sec .more{font:600 14px 'Hind Siliguri',sans-serif;color:var(--r)}
.hero h2.sec{margin-top:0}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.sg>:first-child{grid-column:span 2}
.cat .sg{grid-template-columns:repeat(4,1fr)}
.ls{list-style:none;margin:0;padding:0}
.ls a{display:block;padding:9px 0;border-bottom:1px solid var(--ln);font-weight:600;line-height:1.5}
.ls time{color:var(--r);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:32px;margin-top:6px}
.art{max-width:760px;width:100%;margin:22px auto}
.art h1{font-size:36px;font-weight:800}
.art .mt{color:var(--mut);font-size:15px;margin:12px 0;padding:8px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.art img.hi{width:100%;margin:14px 0}
.art p{margin:0 0 1.1em;font-size:19px;line-height:1.95}
.sh{display:flex;gap:8px;margin:18px 0}
.sh a{border:1px solid var(--ln);padding:3px 14px;font-size:15px;font-weight:600}
.sh a:hover{background:var(--r);border-color:var(--r);color:#fff}
.em{text-align:center;color:var(--mut);padding:70px 0}
footer{background:var(--ink);color:#d8d2cc;margin-top:44px;padding:22px 16px;font-size:15px;text-align:center}
footer div{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-bottom:12px;font-weight:600}
a:focus-visible{outline:3px solid var(--r);outline-offset:2px}
@media(max-width:960px){.hero,.hero.nl,.cols{grid-template-columns:1fr}.col{padding:0;border:0;margin-bottom:22px}.l{grid-template-columns:1fr 1fr}.sg,.cat .sg{grid-template-columns:1fr 1fr}.ad-side{margin:18px auto}}
@media(max-width:560px){.l,.two,.sg,.cat .sg{grid-template-columns:1fr}.sg>:first-child{grid-column:auto}.m .b h2{font-size:26px}.art h1{font-size:27px}nav .w{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){.tw div{animation:none;padding:0}}
</style>
</head>
<body>
<div class="w"><div id="dt"></div></div>
<header><a href="#/"><img src="logo.svg" alt="ভোরের বাণী"></a></header>
<nav><div class="w" id="nav"></div></nav>
<div class="w" id="tkr"></div>
<main class="w" id="app"><p class="em">লোড হচ্ছে…</p></main>
<footer><div id="fc"></div>© ভোরের বাণী। সর্বস্বত্ব সংরক্ষিত।</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="core.js"></script>
<script>
const $ = s => document.querySelector(s);
let N = [], A = {};
const bd = ms => new Date(ms).toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
const tm = ms => new Date(ms).toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
const im = n => n.img ? `<img src="${E(n.img)}" alt="" loading="lazy">` : `<div class="ph"></div>`;
const sn = n => E(String(n.body).replace(/\s+/g, ' ').slice(0, 130)) + '…';
const kk = n => `<span class="k">${E(n.cat)}</span>`;
const big = n => `<a class="b" href="#/n/${n.id}" style="display:block">${im(n)}${kk(n)}<h2>${E(n.title)}</h2><p>${sn(n)}</p><time>${bd(n.date)}</time></a>`;
const card = n => `<a class="s" href="#/n/${n.id}" style="display:block">${im(n)}${kk(n)}<h3>${E(n.title)}</h3><time>${bd(n.date)}</time></a>`;
const latest = L => `<h2 class="sec">সর্বশেষ</h2><ol class="ls">${L.slice(0, 8).map(n => `<li><a href="#/n/${n.id}"><time>${tm(n.date)}</time>${E(n.title)}</a></li>`).join('')}</ol>`;
const ad = k => {
  const a = A[k] || {}, s = SLOTS[k];
  if (a.off) return '';
  const h = a.html || (a.img ? `<a href="${E(a.link || '#')}" target="_blank" rel="noopener sponsored"><img src="${E(a.img)}" alt="বিজ্ঞাপন"></a>` : `বিজ্ঞাপনের জায়গা ${s.size}`);
  return `<div class="ad ad-${k}" style="min-height:${s.h}px">${h}</div>`;
};
function runScripts(el) {
  el.querySelectorAll('.ad script').forEach(o => {
    const s = document.createElement('script');
    [...o.attributes].forEach(a => s.setAttribute(a.name, a.value));
    s.text = o.text; o.replaceWith(s);
  });
}
const enc = encodeURIComponent;
function nav(cur) {
  $('#nav').innerHTML = `<a href="#/" class="${cur ? '' : 'on'}">প্রথম পাতা</a>` + CATS.map(c => `<a href="#/c/${enc(c)}" class="${cur === c ? 'on' : ''}">${c}</a>`).join('');
}
function home(L) {
  if (!L.length) return '<p class="em">এখনো কোনো খবর প্রকাশ হয়নি।</p>';
  const lead = L.find(n => n.featured) || L[0], rest = L.filter(n => n !== lead);
  const left = rest.slice(0, 4), under = rest.slice(4, 6);
  const used = new Set([lead, ...left, ...under].map(n => n.id));
  const secs = CATS.map(c => {
    const f = L.filter(n => n.cat === c && !used.has(n.id)).slice(0, 4);
    return f.length ? `<section class="cat"><h2 class="sec"><a href="#/c/${enc(c)}">${c}</a><a class="more" href="#/c/${enc(c)}">সব খবর →</a></h2><div class="sg">${f.map((n, i) => i ? card(n) : big(n)).join('')}</div></section>` : '';
  }).join('');
  return `${ad('top')}
  <div class="hero ${left.length ? '' : 'nl'}">
    ${left.length ? `<div class="col l">${left.map(card).join('')}</div>` : ''}
    <div class="col m">${big(lead)}${under.length ? `<div class="two">${under.map(card).join('')}</div>` : ''}</div>
    <aside class="col">${latest(L)}${ad('side')}</aside>
  </div>
  ${ad('mid')}${secs}`;
}
function article(n, L) {
  document.title = n.title + ' | ভোরের বাণী';
  const ps = String(n.body).split(/\n+/).map(p => `<p>${E(p)}</p>`);
  ps.splice(2, 0, ad('art'));
  const u = enc(location.href.split('#')[0] + '#/n/' + n.id), rel = L.filter(x => x.cat === n.cat && x.id !== n.id).slice(0, 4);
  return `<div class="cols"><article class="art">${kk(n)}<h1>${E(n.title)}</h1>
    <div class="mt">${n.author ? E(n.author) + ' | ' : ''}প্রকাশ: ${bd(n.date)}, ${tm(n.date)}</div>
    ${n.img ? `<img class="hi" src="${E(n.img)}" alt="">` : ''}${ps.join('')}
    <div class="sh"><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">ফেসবুকে শেয়ার</a><a target="_blank" rel="noopener" href="https://wa.me/?text=${enc(n.title)}%20${u}">হোয়াটসঅ্যাপ</a></div></article>
    <aside>${ad('side')}${latest(L)}</aside></div>
    ${rel.length ? `<h2 class="sec">আরও পড়ুন</h2><div class="sg" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${rel.map(card).join('')}</div>` : ''}`;
}
function route() {
  const [t, v] = location.hash.slice(2).split('/'), id = decodeURIComponent(v || '');
  const L = [...N].sort((a, b) => b.date - a.date);
  let h, cur = '';
  document.title = 'ভোরের বাণী';
  if (t === 'n') { const n = N.find(x => x.id === id); h = n ? article(n, L) : '<p class="em">খবরটি পাওয়া যায়নি।</p>'; }
  else if (t === 'c') {
    cur = id; const f = L.filter(n => n.cat === id);
    h = ad('top') + `<h2 class="sec">${E(id)}</h2>` + (f.length ? `<div class="cols"><div class="sg" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${f.map((n, i) => i ? card(n) : big(n)).join('')}</div><aside>${ad('side')}${latest(L)}</aside></div>` : '<p class="em">এই বিভাগে এখনো খবর নেই।</p>');
  } else h = home(L);
  nav(cur);
  $('#tkr').innerHTML = L.length ? `<div class="tk"><b>সর্বশেষ</b><div class="tw"><div>${L.slice(0, 8).map(n => `<a href="#/n/${n.id}">${E(n.title)}</a>`).join('')}</div></div></div>` : '';
  $('#app').innerHTML = h;
  runScripts($('#app'));
  scrollTo(0, 0);
}
$('#dt').textContent = new Date().toLocaleDateString('bn-BD', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
$('#fc').innerHTML = CATS.map(c => `<a href="#/c/${enc(c)}">${c}</a>`).join('');
Promise.all([DB.all('news'), DB.all('ads')]).then(([n, a]) => {
  N = n; a.forEach(x => A[x.id] = x);
  route(); addEventListener('hashchange', route);
}).catch(() => $('#app').innerHTML = '<p class="em">খবর লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।</p>');
</script>
</body>
</html>
